      "title": "VN-GraphGG: graph-based grain growth",
      "question": "How can grain-scale physical laws and graph neural networks work together to simulate the evolution of polycrystalline microstructures?",
      "approach": "VN-GraphGG uses the von Neumann–Mullins law to evolve grain areas and a graph neural network to reconstruct the two-dimensional microstructure from a graph of grains and junctions.",
